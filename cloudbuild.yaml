substitutions:
  _REGION: europe-west1
  _SERVICE: trainerpt-prod-api
  _MIGRATION_JOB: trainerpt-prod-migrate

steps:
  # Step 1: Build the Docker image
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/trainerpt/${_SERVICE}:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/trainerpt/${_SERVICE}:latest
      - .

  # Step 2: Push the image to Artifact Registry
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/trainerpt/${_SERVICE}

  # Step 3: Run database migrations via Cloud Run Job
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    secretEnv: ['DATABASE_URL']
    args:
      - -c
      - |
        # Update or create the migration job
        gcloud run jobs update ${_MIGRATION_JOB} \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/trainerpt/${_SERVICE}:$COMMIT_SHA \
          --region=${_REGION} \
          --set-env-vars="DATABASE_URL=$$DATABASE_URL" \
          --command="sh" \
          --args="-c,pnpm run db:update" \
          --max-retries=0 \
          --task-timeout=5m \
          2>/dev/null || \
        gcloud run jobs create ${_MIGRATION_JOB} \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/trainerpt/${_SERVICE}:$COMMIT_SHA \
          --region=${_REGION} \
          --set-env-vars="DATABASE_URL=$$DATABASE_URL" \
          --command="sh" \
          --args="-c,pnpm run db:update" \
          --max-retries=0 \
          --task-timeout=5m

        # Execute the migration job and wait for completion
        gcloud run jobs execute ${_MIGRATION_JOB} --region=${_REGION} --wait

  # Step 4: Deploy the new service version (only if migrations succeed)
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/trainerpt/${_SERVICE}:$COMMIT_SHA
      - --region=${_REGION}
      - --allow-unauthenticated

availableSecrets:
  secretManager:
    - versionName: projects/147408060771/secrets/DATABASE_URL_PROD/versions/latest
      env: DATABASE_URL

options:
  logging: CLOUD_LOGGING_ONLY

