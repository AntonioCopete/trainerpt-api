substitutions:
  _REGION: europe-west1
  _SERVICE: trainerpt-prod-api

steps:
  - name: node:24
    entrypoint: bash
    secretEnv: ['DATABASE_URL']
    args:
      - -c
      - |
        corepack enable
        pnpm install --frozen-lockfile
        pnpm run db:update

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --source=.
      - --region=${_REGION}
      - --allow-unauthenticated

availableSecrets:
  secretManager:
    - versionName: projects/147408060771/secrets/DATABASE_URL_PROD/versions/latest
      env: DATABASE_URL

options:
  logging: CLOUD_LOGGING_ONLY
